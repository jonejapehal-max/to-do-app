<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #888; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  <form id="add-form">
    <input type="text" id="title" placeholder="New task..." required>
    <button type="submit">Add</button>
  </form>
  <p id="error"></p>
  <ul id="list"></ul>

  <script>
    const API_URL = "https://to-do-app-msoa.onrender.com";

    const list = document.getElementById("list");
    const errorBox = document.getElementById("error");

    async function api(path, options) {
      try {
        errorBox.textContent = "";
        const res = await fetch(API_URL + path, options);
        if (!res.ok) throw new Error("Server returned " + res.status);
        return await res.json();
      } catch (err) {
        errorBox.textContent = "Could not reach the API: " + err.message;
        throw err;
      }
    }

    const jsonOptions = (method, body) => ({
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    async function loadItems() {
      const items = await api("/items");
      list.innerHTML = "";
      items.forEach(renderItem);
    }

    function renderItem(item) {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = item.done;
      box.onchange = async () => {
        await api("/items/" + item.id, jsonOptions("PUT", { done: box.checked }));
        loadItems();
      };

      const text = document.createElement("span");
      text.textContent = item.title;

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.onclick = async () => {
        await api("/items/" + item.id, { method: "DELETE" });
        loadItems();
      };

      li.append(box, text, del);
      list.appendChild(li);
    }

    document.getElementById("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      await api("/items", jsonOptions("POST", { title: input.value }));
      input.value = "";
      loadItems();
    });

    loadItems();
  </script>
</body>
</html>
